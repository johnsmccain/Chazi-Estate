[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "default"

[rpc_endpoints]
hedera-testnet = "https://testnet.hashio.io/api"
hedera-mainnet = "https://mainnet.hashio.io/api"

[etherscan]
hedera-testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://hashscan.io/testnet" }

# Hedera Testnet
[profile.hedera-testnet]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true